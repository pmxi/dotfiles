# from https://github.com/tmux-plugins/tmux-sensible
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# I commented this out because I'm not using Tmux that old anywhere and I've never had issues.
# (OS X) Fix pbcopy/pbpaste for old tmux versions (pre 2.6)
# set -g default-command "reattach-to-user-namespace -l $SHELL"

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Use vi-style key binds in copy mode.
set -g mode-keys vi

# LOOK INTO THIS.
# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# experimental
bind -n C-p previous-window
bind -n C-n next-window

# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# If prefix is 'C-a'
# bind C-a send-prefix
# change from a -> b because I am keeping the default prefix.
# I might need to change to a because b is annoying with vim.
bind b last-window

# Aesthetics

# OLD COLORS
# nice colors. (NO!)
# set -g status-bg cyan
# set -g window-status-style bg=yellow
# set -g window-status-current-style bg=red,fg=white

# NEW EXPERIMENTAL COLORS
# by gemini-3-flash
# https://gemini.google.com/share/4e2e529c2379
# https://gemini.google.com/app/d7621673bf9c4195

# -- Status Bar --
# Use a very light gray background and a soft dark gray for text
set -g status-style bg='#e5e5e5',fg='#444444'

# Refresh status line every second (optional)
set -g status-interval 1

# -- Windows --
# Default window title colors
set-window-option -g window-status-style fg='#777777',bg='default'

# Active window title colors (using a subtle blue or darker gray)
set-window-option -g window-status-current-style fg='#005f87',bg='default',bold

# -- Panes --
# Subtle borders to stay out of the way
set -g pane-border-style fg='#d0d0d0'
set -g pane-active-border-style fg='#8a8a8a'

# -- Messages --
# Command line and error messages
set -g message-style bg='#005f87',fg='#ffffff'

# -- Layout (Optional) --
# Clean up the left and right status sections
set -g status-left " #S "
set -g status-right "%H:%M "


# END COLORS

# sane navigation. Arrow keys are awkward to reach.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Implement Vim-like "hjkl" keys for pane resizing.
bind C-h resize-pane -L
bind C-j resize-pane -D
bind C-k resize-pane -U
bind C-l resize-pane -R

# Enable mouse support
# fuck that
set -g mouse off

# Start windows and panes at 1, not 0
# disabled because while this could be nice, I already have muscle memory for 0
# and that muscle memory is more portable between machines.
# set -g base-index 1
# setw -g pane-base-index 1


# -n binds it such that the prefix (C-b) is not needed.
bind -n F9 previous-window
bind -n F10 next-window



# New window in the current pane's directory
bind-key c new-window -c '#{pane_current_path}'

# New splits in the current pane's directory
bind-key '"' split-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'


# the following settings are sacred. Do not touch.
set -g set-clipboard on
set -as terminal-features ',rxvt-unicode-256color:clipboard'
# End sacred zone.

bind Left swap-window -t -1 \; select-window -t -1
bind Right swap-window -t +1 \; select-window -t +1
